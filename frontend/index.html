<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#131211" />
    <title>NexusAI</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Resolve the theme before first paint. Without this the app flashes the
      // wrong theme for one frame on every load.
      (function () {
        try {
          var stored = localStorage.getItem('nexusai.theme') || 'system';
          var resolved =
            stored === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : stored;
          document.documentElement.dataset.theme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', resolved === 'light' ? '#FBFAF8' : '#131211');
        } catch (_) {
          /* localStorage unavailable: the dark default in the markup stands */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
